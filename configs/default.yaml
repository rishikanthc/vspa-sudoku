defaults:
  - _self_
  - optional experiment: null

seed: 123

ssp:
  dim: 512
  seed: 42

model:
  context_size: 81
  n_heads: 2
  head_dim: 256
  n_layers: 8
  d_ff: 512
  dropout: 0.1

data:
  num_samples: 4500000
  num_cells_to_mask: 20
  dataset_path: datasets/pretrain_default.pt
  seed: 123
  unique_solution: false
  randomize_mask_per_access: true
  batch_size: 128
  num_workers: 8
  shuffle: true
  pin_memory: true
  drop_last: true

curriculum:
  enabled: false
  mode: adaptive
  max_mask: 81
  num_steps: 20
  step: 1
  patience: 3
  min_delta: 1.0e-6

training:
  max_epochs: 1
  learning_rate: 1e-4

checkpoint:
  dirpath: ${hydra:runtime.cwd}/checkpoints
  filename: pretrain
  monitor: train_loss
  mode: min

logging:
  mlflow_tracking_uri: http://127.0.0.1:5000
  mlflow_save_dir: ${hydra:runtime.cwd}/mlruns
  mlflow_experiment_name: jepa-sudoku-pretrain
  mlflow_run_name: pretrain

trainer:
  accelerator: "cpu"
  devices: 1
  strategy: "auto"
  precision: "32-true"
  matmul_precision: "high"
  deterministic: true
  benchmark: false
  log_every_n_steps: 1
  num_sanity_val_steps: 0
  fast_dev_run: false
  suppress_accumulate_grad_stream_mismatch_warning: true
  limit_train_batches: 1.0
