# @package _global_

data:
  num_samples: 7000000
  num_cells_to_mask: 48
  dataset_path: datasets/pretrain_default.pt
  seed: 123
  unique_solution: false
  randomize_mask_per_access: true
  batch_size: 256
  num_workers: 12
  shuffle: true
  pin_memory: true
  drop_last: true

curriculum:
  enabled: false
  mode: linear
  max_mask: 16
  num_steps: 8000
  step: 1
  patience: 3
  min_delta: 1.0e-6

training:
  max_epochs: 1
  learning_rate: 1e-4

trainer:
  accelerator: "gpu"
  devices: 2
  strategy: "ddp"
  precision: "16-mixed"
  matmul_precision: "high"
  deterministic: true
  benchmark: false
  log_every_n_steps: 1
  num_sanity_val_steps: 0
  fast_dev_run: false
  suppress_accumulate_grad_stream_mismatch_warning: true
  limit_train_batches: 1.0
