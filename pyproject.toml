[project]
name = "jepa-sudoku"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "hydra-core>=1.3.2",
    "gradio>=6.9.0",
    "jaxtyping>=0.3.9",
    "marimo>=0.21.1",
    "matplotlib>=3.10.8",
    "mlflow>=3.5.1",
    "pytest>=9.0.2",
    "torch>=2.8.0,<2.9.0",
    "lightning>=2.6.1",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.7",
    "ty>=0.0.24",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
